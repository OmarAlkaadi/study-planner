# nginx im Frontend-Container: liefert die gebaute React-App aus und leitet /api an das Backend weiter.
# Diese Datei landet als /etc/nginx/conf.d/default.conf im Container (siehe Dockerfile).

# ---------- Anfrage-Limits pro IP-Adresse ----------
# Schutz gegen Passwort-Raten, massenhafte Registrierungen und Mail-Spam über "Passwort vergessen".
# Anmeldung & Co.: 10 Anfragen pro Minute; übrige API: 20 pro Sekunde. Darüber → HTTP 429.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    # nginx-Version nicht in Antworten verraten
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Text-Dateien komprimiert ausliefern (deutlich kleiner, schnelleres Laden)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # Zu viele Anfragen → JSON im gleichen Format wie die Fehler des Backends (Problem Details),
    # damit das Frontend die Meldung direkt anzeigen kann
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/problem+json;
        return 429 '{"status":429,"title":"Zu viele Anfragen","detail":"Zu viele Anfragen. Bitte warte einen Moment und versuche es dann erneut."}';
    }

    # Anmeldung, Registrierung, Bestätigung, "Passwort vergessen": streng begrenzt
    # (burst = kurze Spitzen von bis zu 5 zusätzlichen Anfragen sind erlaubt, z. B. bei Tippfehlern)
    location ~ ^/api/auth/(login|register|verify-email|resend-verification|forgot-password|reset-password)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Übrige API-Aufrufe an den Backend-Container weiterleiten
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Gebaute Dateien mit Hash im Namen dürfen lange gecacht werden.
    # (Eigener add_header → die Sicherheits-Header müssen hier erneut eingebunden werden.)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-Page-App: unbekannte Pfade (z. B. /tasks) liefern index.html,
    # das Routing übernimmt React Router im Browser
    location / {
        try_files $uri $uri/ /index.html;
    }
}
