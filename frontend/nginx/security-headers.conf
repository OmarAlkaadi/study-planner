# Sicherheits-Header für jede Antwort (auch Fehlerseiten: "always").
# Wird in nginx.conf eingebunden – in jedem location-Block mit eigenem add_header erneut,
# weil nginx sonst die Header aus dem server-Block nicht übernimmt.

# Content-Security-Policy: Der Browser lädt Skripte, Styles, Bilder und Daten nur von der eigenen Adresse.
# Eingeschleuster Code von fremden Seiten wird damit nicht ausgeführt; die Seite darf nicht in fremde
# Seiten eingebettet werden (frame-ancestors, Schutz vor Clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Dateitypen nicht "erraten" – eine hochgeladene Textdatei wird nie als Skript ausgeführt
add_header X-Content-Type-Options "nosniff" always;

# Keine Referrer weitergeben: Links aus E-Mails enthalten Einmal-Tokens in der Adresse
add_header Referrer-Policy "no-referrer" always;

# Nicht in Frames einbetten (für ältere Browser zusätzlich zu frame-ancestors)
add_header X-Frame-Options "DENY" always;

# Kamera, Mikrofon, Standort usw. werden nicht gebraucht
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Fenster, die von anderen Seiten geöffnet werden, bekommen keinen Zugriff auf diese Seite
add_header Cross-Origin-Opener-Policy "same-origin" always;
